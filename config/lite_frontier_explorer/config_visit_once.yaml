frontier_explorer:
  ros__parameters:
    # Observable unknown area / (1 + gain_distance_weight * path metres).
    # Rays stop at lethal obstacles; score actual reachable frontier cells.
    # Legacy comparison: selection_strategy: nearest_high_gain
    selection_strategy: visible_gain
    # Common map-only cluster ranking; robot1 gets rank1, robot2 rank2, etc.
    # Set independent to reproduce the previous per-robot utility policy.
    frontier_assignment: robot_rank
    sensor_range_m: 3.0
    gain_distance_weight: 1.0
    gain_max_viewpoints: 5
    goal_preempt_utility_ratio: 1.25

    # Global costmap topic used to compute frontiers. Multi-robot launch files
    # override this per-robot; this is just the standalone default.
    costmap_topic: /global_costmap/costmap

    # Nav2 NavigateToPose action name.
    navigate_to_pose_action_name: navigate_to_pose

    # Global frame used for frontier goals and TF lookups.
    global_frame: map

    # Robot base frame used for TF lookups.
    robot_base_frame: base_footprint

    # Occupancy threshold applied to the global costmap during frontier validation.
    # Cells at or above this cost are treated as blocked. Value between 0-100.
    # Was 95 -- barely below nav2's own inscribed/lethal cutoff (99/100), which let
    # frontier cells (and therefore goal centroids, via cluster_centroid_world's
    # cell-average) sit deep inside the inflation gradient right next to a wall.
    # That's a likely cause of robots getting physically stuck/wedged near walls:
    # the sent goal required the footprint to sit in high-cost, steep-falloff
    # territory (local_costmap's inflation_radius 0.32 / cost_scaling_factor 8.0
    # in navigation.yaml) to be considered "reached". Lower than config.yaml's
    # equivalent -- tuned against real turtlebot3_waffle hardware (0.22 m/s,
    # ~3.5m real LDS-01 lidar range), which needs a stricter obstacle margin than
    # mogi_bot's longer-range sensor.
    occ_threshold: 50

    # Minimum connected frontier size accepted by frontier detection, measured
    # in cells. No filtering (1): a >1 floor can discard every cluster on a
    # small/fragmented mission-start costmap, which _tick() then misreports
    # as "no frontiers left -- exploration complete" even though frontier
    # cells exist. Selection strategies already rank candidates by
    # gain/distance and drop unreachable ones via the BFS path check, so a
    # tiny sliver frontier only gets driven to if it's genuinely the best
    # (or only) reachable option -- no separate size gate needed to avoid it.
    min_frontier_size_cells: 2

    # Minimum distance in meters between the robot and a candidate frontier.
    min_frontier_distance_m: 2.0

    # Seconds between replanning attempts.
    replan_period_s: 3.0

    # Abandon an in-flight goal the robot is making no headway toward, instead
    # of waiting out nav2's full BT recovery chain (progress checker, then up
    # to 6 retries of clear-costmap / spin / back-up / wait). That chain is
    # where the observed 1-to-several-minute stalls came from when a robot
    # wedged on the curved reception desk or in a doorway: nav2 does recover,
    # it is just far slower than giving up on that frontier and driving
    # somewhere else. On timeout the goal is cancelled AND blacklisted, so the
    # next tick picks a genuinely different frontier rather than re-sending
    # the same one.
    #
    # The timer is measured on robot displacement, not wall clock -- any
    # movement past goal_stuck_epsilon_m resets it -- so a legitimately long
    # drive across the building never trips it. Raise the timeout if tight
    # squeezes are being abandoned too eagerly; note replan_period_s (3.0 s)
    # is the sampling interval, so the effective granularity is ~3 s.
    goal_stuck_timeout_s: 12.0
    goal_stuck_epsilon_m: 0.15
