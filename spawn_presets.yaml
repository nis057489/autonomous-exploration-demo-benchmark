# Robot spawn position presets.
#
# Structure: world → preset_name → list of {x, y, yaw} positions.
# Robot N gets positions[N-1]; cycles if there are more robots than positions.
#
# Usage:
#   SPAWN_PRESET=distributed NUM_ROBOTS=4 ./docker.sh corridor
#
# "default" preset: single base position matching the hardcoded defaults in launch.sh.
#   Multi-robot runs with the default preset still use the automatic grid/line offset
#   logic (the list is ignored for multi-robot when SPAWN_PRESET=default).
#   Exception: long_t uses its distributed positions for multi-robot default.
#
# "distributed" preset: each robot placed in a distinct section of the map so they
#   explore independently without overlapping initial frontiers.
#
# Corridor layout reference (from corridor.world SDF):
#   central corridor : x ∈ [-9, 9],      y ∈ [-2,   2]
#   top-left room    : x ∈ [-6, -3],     y ∈ [ 2, 6.5]
#   top-right room   : x ∈ [ 3,  6],     y ∈ [ 2, 6.5]
#   bottom-left room : x ∈ [-5.6, -3.4], y ∈ [-6.5, -2]
#   bottom-mid room  : x ∈ [-1.1,  1.1], y ∈ [-6.5, -2]
#   bottom-right room: x ∈ [ 3.4,  5.6], y ∈ [-6.5, -2]
#
# Bookstore and warehouse positions are good starting points; tune against the map
# if robots spawn inside walls.

bookstore:
  default:
    - { x: 1.23, y: 6.35, yaw: -3.10 }
  distributed:
    - { x: 0.44, y: 2.00, yaw: 0.51 }
    - { x: -0.73, y: 3.84, yaw: 0.11 }
    - { x: 1.42, y: 2.00, yaw: 3.14 }

corridor:
  default:
    - { x: -8.11, y: 0.31, yaw: 0.00 }
  distributed:
    - { x: 1.00, y: 1.00, yaw: 0.0000 } # left corridor end
    - { x: 1.50, y: 1.30, yaw: 3.1416 } # right corridor end
    - { x: 0.00, y: 0.00, yaw: -1.5707 } # top-left room


warehouse:
  default:
    - { x: -12.97, y: 8.23, yaw: 1.58 }
  distributed:
    - { x: 1.00, y: 1.00, yaw: 0.0000 } # left corridor end
    - { x: 1.50, y: 1.30, yaw: 3.1416 } # right corridor end
    - { x: 0.00, y: 0.00, yaw: -1.5707 } # top-left room

maze:
  default:
    - { x: -2.50, y: -2.00, yaw: 0.00 }

mine:
  default:
    - { x: 0.00, y: 0.00, yaw: 0.00 }

# long_t is a plain T: a 20 m east-west cross hall (x -10..10, y -2..2), a 5 m
# southbound stem (x -2..2, y -5..0), and two dead-end "trap" branches hanging
# south off the hall ends (x -10..-6 and 6..10, y -17..-2). Floor spans
# y -17..2. The two centerline starts can see the nearby stem bottom wall.
long_t:
  # Short stem, facing north toward the T junction. Matches the
  # suggested start pose in long_t.sdf and the hardcoded default in launch.sh.
  default:
    - { x: 0.00, y: -3.00, yaw: 1.5707963267948966 }

  # Robot 1's start is retained; robot 2 is 1 m directly behind it.
  # Both face north. EXPLORE_START_STAGGER_S controls robot 2's delayed release.
  distributed:
    - { x: 0.00, y: -3.00, yaw: 1.5707963267948966 }
    - { x: 0.00, y: -4.00, yaw: 1.5707963267948966 }


  # Shared cross hall: abreast on the hall centerline over the stem mouth, so no
  # robot's start assigns it a branch. All face north at the closed hall wall,
  # leaving the stem, left trap and right trap equidistant behind/beside them.
  shared_hall:
    - { x: -1.50, y: 0.00, yaw: 1.5707963267948966 }
    - { x: 0.00, y: 0.00, yaw: 1.5707963267948966 }
    - { x: 1.50, y: 0.00, yaw: 1.5707963267948966 }

small_maze:
  default:
    - { x: 2.00, y: 2.00, yaw: 0.00 }
    - { x: 1.50, y: 2.00, yaw: 0.00 }
    - { x: 1.00, y: 2.00, yaw: 0.00 }

# maze2: 2.4 m corridors on a 3 m grid, x:[-1.2,31.2] y:[-1.2,25.2]. All three
# are candidates from maze2.sdf's header and measured 1.2 m clear (corridor
# center). They share the SW corner -- (0,0) and (6,0) are the same corridor --
# and each faces its open direction.
maze2:
  default:
    - { x: 0.00, y: 0.00, yaw: 0.0000 }
  distributed:
    - { x: 0.00, y: 0.00, yaw: 0.0000 }
    - { x: 6.00, y: 0.00, yaw: 1.5708 }
    - { x: 0.00, y: 6.00, yaw: 1.5708 }

# tunnel_qualification: abreast in the SubT staging pad, all facing the
# tunnel entrance at +x. Everything else on the pad is >=7 m away.
tunnel_qualification:
  default:
    - { x: 2.00, y: 0.00, yaw: 0.00 }
  distributed:
    - { x: 2.00, y: 0.00, yaw: 0.00 }
    - { x: 2.00, y: -2.50, yaw: 0.00 }
    - { x: 2.00, y: 2.50, yaw: 0.00 }

# final_prelim_03: abreast in the Finals Staging Area room, all facing its
# single ~2 m exit on the centerline. Measured clearance at robot height:
# 3.9 m at y=0, 2.6 m at y=+-2.5.
final_prelim_03:
  default:
    - { x: -15.00, y: 0.00, yaw: 0.00 }
  distributed:
    - { x: -15.00, y: 0.00, yaw: 0.00 }
    - { x: -15.00, y: -2.50, yaw: 0.00 }
    - { x: -15.00, y: 2.50, yaw: 0.00 }

# Office presets use office.world collision geometry, not the unrelated shipped
# map.png. Current static check: 438 collision volumes and 637.4 m² in the
# connected interior at z=0.10 m. Some apparent rooms are solid blocks.
# shared_hall is the occupancy-only staggered pilot; distributed is a legacy
# eastern-start preset retained for replay compatibility.
office:
  default:
    - { x: 17.10, y: 5.30, yaw: 3.1416 }
  distributed:
    - { x: 14.10, y: 4.50, yaw: 5.2360 }
    - { x: 14.10, y: 1.50, yaw: 3.1416 }
    - { x: 14.10, y: 7.50, yaw: 1.0472 }

  # Shared southern hall: no robot is assigned a separate wing by its start.
  # All face west toward the western circulation spine; see office_start_layout.svg.
  shared_hall:
    - { x: -3.50, y: 2.00, yaw: 3.141592653589793 }
    - { x: -1.00, y: 2.00, yaw: 3.141592653589793 }
    - { x: 1.50, y: 2.00, yaw: 3.141592653589793 }
