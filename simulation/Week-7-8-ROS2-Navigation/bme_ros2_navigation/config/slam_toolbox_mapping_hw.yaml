slam_toolbox:
  ros__parameters:
    # ── Solver ───────────────────────────────────────────────────────────
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_scan_matching: true
    use_scan_barycenter: true
    mode: mapping

    use_sim_time: false
    # Looser TF timeout to tolerate real-hardware latency.
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    # Rebuilding+publishing the full OccupancyGrid raster from the pose graph
    # is itself real CPU cost -- doing it 4x less often doesn't touch
    # localization/matching quality, only how often the visual map refreshes.
    map_update_interval: 20.0

    # LDS-02 (ld08_driver) max range is 8.0 m.
    max_laser_range: 8.0
    # 0.0 meant reprocessing every single scan even while stationary -- pure
    # wasted CPU on an already CPU-constrained Pi, and these robots spend a
    # lot of time not moving (on blocks) during testing. A few cm/degrees of
    # dead zone costs negligible map fidelity but skips redundant scan
    # matching + pose graph work when nothing has actually changed.
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.05
    # Fewer historical scans to compare each new scan against for local
    # linking -- less per-scan CPU, at the cost of slightly less robust
    # local matching.
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 8.0
    link_match_minimum_response_fine: 0.25
    link_scan_maximum_distance: 1.5

    loop_search_maximum_distance: 3.0
    # Loop closure triggers full pose-graph Ceres optimization -- one of the
    # most expensive things this node does, and it only gets more expensive
    # as the map grows. Not worth it on hardware this CPU-constrained; a
    # small amount of accumulated drift is a better tradeoff than SLAM
    # stalling entirely.
    do_loop_closing: false
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    correlation_search_space_dimension: 0.8
    # This is the local scan-matching search grid, evaluated on EVERY scan
    # (not just loop closure) -- dimension/resolution steps per axis, so
    # 0.01->0.02 is a 4x reduction in correlation evaluations per match
    # (80x80 -> 40x40 grid), directly cutting the cost of the exact
    # operation that was making even the first scan take unboundedly long.
    correlation_search_space_resolution: 0.02
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    resolution: 0.05
    max_submaps: 15

    debug_logging: false
    throttle_scans: 1
    enable_interactive_mode: false
    use_lifecycle_manager: false
    use_response_expansion: true
    stack_size_to_use: 40000000
