slam_toolbox:
  ros__parameters:
    # ── Solver ───────────────────────────────────────────────────────────
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_scan_matching: true
    use_scan_barycenter: true
    mode: mapping

    use_sim_time: false
    # Looser TF timeout to tolerate real-hardware latency.
    transform_timeout: 0.5
    tf_buffer_duration: 60.0
    map_update_interval: 10.0
    minimum_time_interval: 0.5

    # LDS-02 (ld08_driver) max range is 8.0 m.
    max_laser_range: 8.0
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.05
    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 8.0
    link_match_minimum_response_fine: 0.25
    link_scan_maximum_distance: 1.5

    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    correlation_search_space_dimension: 0.8
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    resolution: 0.05
    max_submaps: 5

    debug_logging: false
    # 1 (every scan) means scans arrive faster than the TF-synced message
    # filter can drain its queue -- observed continuously dropping "queue is
    # full" on all 3 robots, with robot1/robot3 never processing a single
    # scan successfully. Taking every 3rd scan directly cuts the input rate
    # hitting that queue.
    throttle_scans: 3
    enable_interactive_mode: false
    use_lifecycle_manager: true
    use_response_expansion: true
    stack_size_to_use: 40000000
