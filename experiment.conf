# VXCH experiment configuration.
# Source this file or set these env vars before running docker.sh / launch_real_hardware.sh.
# All values are optional; the defaults below produce an unmodified baseline run with no DDIL.

MAP_TRANSPORT=vxch    # baseline | vxch
CONTROLLER_TYPE=pure_pursuit  # sim only (real hardware always uses navigation_hw.yaml's
                          # own controller_server config, unaffected by this var).
                          # pure_pursuit (default) = nav2_regulated_pure_pursuit_controller,
                          # mirroring navigation_hw.yaml's real-hardware tuning exactly so
                          # sim and hardware behavior are comparable. mppi = sim's original
                          # controller (nav2_mppi_controller), kept for A/B comparison
                          # against pure_pursuit.
IMPAIRMENT_MODE=tc       # sim | tc (sim-only; ignored on real hardware, which is
                          # always shaped for real by the router/wifi). sim (default) =
                          # ddil_proxy_node's in-process token-bucket/loss/delay
                          # simulation. tc = real per-robot network namespaces joined by
                          # veth pairs, shaped with actual `tc netem` (see
                          # simulation/Week-7-8-ROS2-Navigation/bme_ros2_navigation/
                          # scripts/setup_ddil_netns.sh) -- the same tool used to
                          # throttle the wireless interface in the hardware test, so sim
                          # results are comparable to hardware ones instead of only to
                          # ddil_proxy_node's software approximation. Requires the
                          # container to be started with CAP_NET_ADMIN (docker.sh adds
                          # this automatically when IMPAIRMENT_MODE=tc).
IMPAIRMENT_DELAY_S=30     # tc only: seconds after launch to let ROS2/DDS discovery
                          # settle across the netns boundary (unshaped) before tc netem
                          # is actually applied. Discovery needs several SPDP announce/
                          # response round-trips; applying tight bandwidth/loss/delay
                          # before it completes can prevent it from ever completing.
BANDWIDTH_KBPS=2000          # rate limit on map transport link (0 = unlimited) -- token
                          # bucket in sim mode, tc netem `rate` in tc mode
LOSS_PCT=0.0              # per-message drop probability 0–100 -- tc netem `loss` in tc mode
DELAY_MS=0                # additional forwarding delay in ms -- tc netem `delay` in tc mode
HAAR_LEVELS=5             # Haar wavelet decomposition levels (vxch only; total bands = levels+1)
COMPRESSION=zstd          # vxch only: zstd | none -- zstd-compresses each band's zigzag-varint
                          # payload before it goes on the wire; none sends the raw varint bytes,
                          # useful for isolating how much of vxch's bandwidth win is the wavelet/
                          # tiling encoding itself vs. the compression layered on top of it
VARINT_ENCODING=true      # vxch only: true | false -- ablation knob, independent of COMPRESSION
                          # above. true = zigzag-varint pack each band's Haar coefficients
                          # before compression (current default); false = pack them as
                          # fixed-width int32 instead. COMPRESSION=none alone still leaves
                          # varint packing in place, so it only shows "wavelet + varint, no
                          # zstd" vs "wavelet + varint + zstd" -- set this to false too (with
                          # COMPRESSION=none) to isolate varint packing's own contribution
TILE_SIZE_M=2.0           # vxch only: encode the map as independent tile_size_m x tile_size_m
                          # Haar pyramids instead of one pyramid for the whole grid, so a
                          # still-changing area (wherever a robot currently is) can't starve
                          # another, already-settled area's detail bands from reaching a peer
SCHEDULE_MODE=rd          # vxch only: smart | simple | rd. smart = only resend a band when its
                          # content actually changed, least-recently-sent-first within a tile.
                          # simple = always resend every band every cycle, strict coarsest-
                          # first, no change detection at all -- this is what the baseline
                          # transport already does (ddil_proxy_node has no dedup/priority
                          # logic for the plain OccupancyGrid topic it relays, so baseline
                          # resends the whole map unconditionally on every SLAM
                          # map_update_interval tick). Use simple for a vxch-vs-baseline
                          # comparison that isolates what the wavelet/tiling encoding itself
                          # saves, independent of vxch's extra scheduling smarts.
RANDOM_SEED=42            # RNG seed for DDIL packet-loss reproducibility (-1 = non-deterministic)
ROBOT_STARTUP_DELAY_S=5.0 # per-robot exploration stagger: robot N waits N*delay seconds (0 = simultaneous)
SPAWN_PRESET=distributed  # default | distributed (or any preset name in spawn_presets.yaml)

# RECORD_METRICS: on real hardware (--robot-id path), record a rosbag
# (/{robot}/explore/traversed_path, for path length; /{robot}/map, this
# robot's own raw local SLAM map; /{robot}/nav_map, the per-robot composite
# of local SLAM + fused team map -- NOTE: per_robot_map_compositor.py
# silently falls back to publishing local-only data on nav_map if it never
# receives a team map, so nav_map alone doesn't prove fusion happened, only
# /map and team_map_ddil together do; /{robot}/team_map_ddil, the raw
# fused-from-peers map ("the ddil map") before that local merge; plus, on
# vxch runs, this robot's own /{robot}/vxch/map/band_*+manifest and, per
# peer, the /{robot}/incoming/{peer}/band_*+manifest it actually received
# after DDIL throttling -- the real vxch traffic between robots) plus a
# periodic CPU load sample into experiment_runs/<timestamp>_<transport>_<robot>/, and
# redirect that run's ROS node logs there too (ddil_proxy_node's periodic
# "stats | rcvd=... sent=..." lines and occupancy_grid_vxch_node's "encode
# bands [...] total=... KB" lines give a free running summary alongside the
# bagged messages). Pull results with ./recover_metrics.sh. Off by default --
# only enable for a baseline/vxch comparison run.
RECORD_METRICS=true

NUM_ROBOTS=3

# ROBOT_HOSTS: real-hardware distributed map sharing. Every robot in the team,
# "name@ip@x@y@yaw" comma-separated (x/y/yaw = that robot's spawn offset in the
# shared map frame, matching what you pass via --robot-offset-x/y/yaw when you
# launch it). Each robot's own launch_real_hardware.sh excludes itself to get
# its peer list. Leave empty/commented to disable map sharing (single robot,
# or robots that don't need each other's maps).
ROBOT_HOSTS=robot1@192.168.100.108@0.0@0.0@0.0,robot2@192.168.100.135@6.0@1.3@0.0,robot3@192.168.100.114@0.0@-3.4@0.0