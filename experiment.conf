# VXCH experiment configuration.
# Source this file or set these env vars before running docker.sh / launch_real_hardware.sh.
# All values are optional; the defaults below produce an unmodified baseline run with no DDIL.

MAP_TRANSPORT=vxch    # baseline | vxch
BANDWIDTH_KBPS=0          # token-bucket rate limit on map transport link (0 = unlimited)
LOSS_PCT=0.0              # per-message drop probability 0–100
DELAY_MS=0                # additional forwarding delay in ms
HAAR_LEVELS=4             # Haar wavelet decomposition levels (vxch only; total bands = levels+1)
RANDOM_SEED=42            # RNG seed for DDIL packet-loss reproducibility (-1 = non-deterministic)
