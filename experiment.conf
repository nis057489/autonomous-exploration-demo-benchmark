# VXCH experiment configuration.
# Source this file or set these env vars before running docker.sh / launch_real_hardware.sh.
# All values are optional; the defaults below produce an unmodified baseline run with no DDIL.

MAP_TRANSPORT=vxch    # baseline | vxch | zstd
CONTROLLER_TYPE=pure_pursuit  # sim only (real hardware always uses navigation_hw.yaml's
                          # own controller_server config, unaffected by this var).
                          # pure_pursuit (default) = nav2_regulated_pure_pursuit_controller,
                          # mirroring navigation_hw.yaml's real-hardware tuning exactly so
                          # sim and hardware behavior are comparable. mppi = sim's original
                          # controller (nav2_mppi_controller), kept for A/B comparison
                          # against pure_pursuit.
IMPAIRMENT_MODE=sim       # sim | tc (sim-only; ignored on real hardware, which is
                          # always shaped for real by the router/wifi). sim (default) =
                          # ddil_proxy_node's in-process token-bucket/loss/delay
                          # simulation. tc = real per-robot network namespaces joined by
                          # veth pairs, shaped with actual `tc netem` (see
                          # simulation/Week-7-8-ROS2-Navigation/bme_ros2_navigation/
                          # scripts/setup_ddil_netns.sh) -- the same tool used to
                          # throttle the wireless interface in the hardware test, so sim
                          # results are comparable to hardware ones instead of only to
                          # ddil_proxy_node's software approximation. Requires the
                          # container to be started with CAP_NET_ADMIN (docker.sh adds
                          # this automatically when IMPAIRMENT_MODE=tc).
IMPAIRMENT_DELAY_S=30     # tc only: seconds after launch to let ROS2/DDS discovery
                          # settle across the netns boundary (unshaped) before tc netem
                          # is actually applied. Discovery needs several SPDP announce/
                          # response round-trips; applying tight bandwidth/loss/delay
                          # before it completes can prevent it from ever completing.
BANDWIDTH_KBPS=30          # rate limit on map transport link (0 = unlimited) -- token
                          # bucket in sim mode, tc netem `rate` in tc mode.
                          #
                          # SIZING THIS MATTERS MORE THAN IT LOOKS. Measured on
                          # experiment_runs/20260910_004301_vxch_office, one
                          # robot's encoder offered ~81 kbps of band traffic
                          # (tile_size_m=2.0, haar_levels=2, send_rate_hz=1,
                          # every dirty tile sending a band every tick). Against
                          # that offered load:
                          #   <  ~19 kbps : the COARSE layer alone saturates the
                          #                 link; bands 1-2 never flow at all, so
                          #                 a peer gets a permanently blurry map
                          #                 and no coarse-to-fine progression.
                          #   ~20-40 kbps : coarse + mid detail.
                          #   >= ~50 kbps : all three bands flow -- this is the
                          #                 lowest setting at which a receiver
                          #                 actually shows coarse-then-refine.
                          #   >= ~80 kbps : nothing shed at all.
                          # A run at 5 kbps looks broken because it IS starved:
                          # peers end up holding a small frozen fraction of each
                          # other's maps. Raise this (or raise TILE_SIZE_M /
                          # HAAR_LEVELS to make band 0 cheaper) before concluding
                          # the codec is at fault. Live-tunable at runtime from
                          # RViz -- see the NetworkStatsPanel "Bandwidth, all
                          # links" control, which sets ddil_proxy_node's
                          # bandwidth_kbps parameter in place with no relaunch.

# ── ddil_proxy_node queue tuning ──────────────────────────────────────────────
# Not plumbed through this file (no launch argument); these are node parameters
# with the defaults noted, settable live with `ros2 param set /ddil_proxy_<link>
# <name> <value>`. Documented here because they decide what a starved link does
# with the traffic it cannot carry, which is the difference between "degraded"
# and "apparently broken".
#
#   max_queue_seconds (default 4.0)
#     How many seconds of the link's own capacity the relay queue may hold
#     before it drops its FINEST queued bands to stay inside that. 0 = unbounded,
#     which is what it used to be, and what made a starved link look broken: the
#     backlog grew for the whole run (measured live: 4.0 MB queued, a 1h47m ETA
#     on band_2), so everything delivered was minutes-to-hours stale and a peer
#     froze holding 64 of the sender's 468 explored tiles. Shedding finest-first
#     spends a starved link on coarse coverage of the whole map instead.
#
#   priority_aging_ms (default 15000)
#     Per-band-index step of the absolute starvation deadline: a queued band_k
#     jumps ahead of other bands once it has waited priority_aging_ms * k. Keep
#     it well ABOVE max_queue_seconds. It used to be a continuous decay at 250ms,
#     which flattened every band to one priority tier within 750ms of queueing --
#     under a real backlog that turned the priority queue into plain FIFO and
#     destroyed coarsest-first entirely (measured: bands 0/1/2 delivered
#     73/91/107, i.e. more fine detail than coarse).
#
#   manifest_min_interval_s (default 3.0)
#     Minimum spacing between relayed manifests. The manifest outranks every
#     band (a decoder cannot place a tile without geometry) and the encoder
#     republishes one every send tick, so at 1 Hz its ~470 B was consuming 51% of
#     a 625 B/s link (measured: 138 KB of 394 KB sent). Spacing it out hands that
#     back to actual map data; the queue dedups manifests latest-wins, so what
#     does go out is always the newest.
# ── Time-varying link capacity ────────────────────────────────────────────────
# BANDWIDTH_KBPS above is one constant for the whole run, which measures
# STEADY-STATE throughput: how much map each transport pushes through a fixed
# pipe. That is not what vxch actually claims. Its claim is graceful
# degradation -- under a starved link it still delivers coarse coverage of the
# whole map, and when capacity returns it refines. Both halves of that are
# TRANSIENTS, and a constant-capacity run is structurally blind to a transient.
# These knobs vary capacity during the run so those transients are measurable.
#
# Two rules the design follows from, worth keeping in mind before changing any
# of this:
#
#   1. The schedule is an INDEPENDENT VARIABLE -- exogenous, deterministic, and
#      identical across arms. It is never a function of robot state, map state,
#      or which transport is running; if capacity became endogenous to the
#      policy under test, a baseline-vs-vxch comparison would mean nothing. The
#      whole trace is therefore generated up front from RANDOM_SEED (see
#      tools/gen_link_schedule.py) and written to <run>/link_schedule.json
#      BEFORE the stack launches, so two arms' schedules can be diffed
#      byte-for-byte to prove they saw the same conditions. Nothing downstream
#      of the link may read it -- letting the vxch encoder see capacity coming
#      would be encoder backpressure, an advantage the baseline transport
#      structurally cannot have.
#
#   2. Excite the regimes; don't average them. Real links fail in BURSTS, not
#      smoothly, and burstiness is also what makes them measurable -- a hard
#      transition gives every transient metric an edge to align to. A sine wave
#      is the worst of both: radios do not fade sinusoidally, its time-at-value
#      distribution is arcsine so it is already a smeared square wave, and
#      because it sweeps continuously through the regime boundaries documented
#      under BANDWIDTH_KBPS above, no sample is ever in steady state -- every
#      measurement is contaminated by the one before it.
#
LINK_PROFILE=gilbert_elliott       # static | gilbert_elliott | staircase
                          # static (default) = one constant BANDWIDTH_KBPS for
                          # the whole run, i.e. current behavior, no scheduler
                          # node launched. Keep this as the control condition --
                          # without it there is nothing to attribute a
                          # varying-capacity result against.
                          # gilbert_elliott = seeded two-state good/bad link
                          # with exponential dwells. Realistic AND step-shaped.
                          # staircase = deterministic descent/ascent through
                          # 80/50/30/15/30/50/80 kbps, each rung visited on the
                          # way down (filling a backlog) and again on the way up
                          # (draining one) -- those are different operating
                          # points and the difference is the queue behavior
                          # under test. Not more realistic than gilbert_elliott,
                          # but the cleanest thing to read by eye off one run.
                          #
                          # SIM ONLY. In tc mode the shaping lives in the kernel
                          # and bandwidth_kbps is pinned to 0 to stop the token
                          # bucket double-throttling on top of it; the launch
                          # file refuses a schedule there rather than quietly
                          # shaping the run twice at two different rates.
LINK_GOOD_KBPS=50         # gilbert_elliott: capacity in the "good" state. 80 is
                          # the measured "nothing shed at all" point from the
                          # BANDWIDTH_KBPS notes above, not a round number.
LINK_BAD_KBPS=25          # gilbert_elliott: capacity in the "bad" state. Below
                          # the ~19 kbps floor where the COARSE layer alone
                          # saturates the link -- the bad state has to genuinely
                          # starve or there is nothing for the recovery
                          # transient to recover FROM.
LINK_GOOD_DWELL_S=90      # mean seconds per good stretch (exponential)
LINK_BAD_DWELL_S=30       # mean seconds per outage (exponential). With the
                          # defaults above this is a ~75%/25% good/bad duty
                          # cycle; a ~730s run gets 6-9 outages.
LINK_MIN_DWELL_S=15       # hard floor on any segment. An exponential draw will
                          # happily emit a 0.4s blip, and anything at that scale
                          # sits BELOW the stack's own time constants
                          # (max_queue_seconds=4.0, manifest_min_interval_s=3.0,
                          # the encoder's 1 Hz send tick) -- what you would
                          # measure there is the relay queue ringing, not the
                          # transport's behavior. Applied WITHOUT distorting the
                          # mean dwells above (see _dwell in
                          # tools/gen_link_schedule.py: the naive
                          # draw-and-resample is memoryless and would silently
                          # inflate every mean by a full LINK_MIN_DWELL_S, so a
                          # requested 30s outage would really be 45s).
LINK_WARMUP_S=60          # hold the good state this long before the first
                          # transition. Same hazard IMPAIRMENT_DELAY_S and
                          # set_wifi_bandwidth.sh's --delay-s already guard:
                          # DDS discovery needs several SPDP round-trips,
                          # FastDDS does not reliably retry a handshake that
                          # failed at startup, and a pair that never discovered
                          # each other stays silently unmatched for the rest of
                          # the run -- indistinguishable from "the link was too
                          # slow" unless you go read the proxy's rcvd counters.
                          # A run never opens in the bad state.
LINK_DURATION_S=900       # how much time the schedule must cover. Make this >=
                          # the run's actual length (run_transport_sweep.sh's
                          # RUN_DURATION_S); a schedule shorter than the run
                          # just holds its last segment to the end.

LOSS_PCT=0.0              # per-message drop probability 0–100 -- tc netem `loss` in tc mode
DELAY_MS=0                # additional forwarding delay in ms -- tc netem `delay` in tc mode
HAAR_LEVELS=2             # Haar wavelet decomposition levels (vxch only; total bands = levels+1)
COMPRESSION=zstd          # vxch only: zstd | none -- zstd-compresses each band's zigzag-varint
                          # payload before it goes on the wire; none sends the raw varint bytes,
                          # useful for isolating how much of vxch's bandwidth win is the wavelet/
                          # tiling encoding itself vs. the compression layered on top of it
VARINT_ENCODING=true      # vxch only: true | false -- ablation knob, independent of COMPRESSION
                          # above. true = zigzag-varint pack each band's Haar coefficients
                          # before compression (current default); false = pack them as
                          # fixed-width int32 instead. COMPRESSION=none alone still leaves
                          # varint packing in place, so it only shows "wavelet + varint, no
                          # zstd" vs "wavelet + varint + zstd" -- set this to false too (with
                          # COMPRESSION=none) to isolate varint packing's own contribution
TILE_SIZE_M=2.0           # vxch only: encode the map as independent tile_size_m x tile_size_m
                          # Haar pyramids instead of one pyramid for the whole grid, so a
                          # still-changing area (wherever a robot currently is) can't starve
                          # another, already-settled area's detail bands from reaching a peer
SCHEDULE_MODE=smart          # vxch only: smart | simple | rd. smart = only resend a band when its
                          # content actually changed, least-recently-sent-first within a tile.
                          # simple = always resend every band every cycle, strict coarsest-
                          # first, no change detection at all -- this is what the baseline
                          # transport already does (ddil_proxy_node has no dedup/priority
                          # logic for the plain OccupancyGrid topic it relays, so baseline
                          # resends the whole map unconditionally on every SLAM
                          # map_update_interval tick). Use simple for a vxch-vs-baseline
                          # comparison that isolates what the wavelet/tiling encoding itself
                          # saves, independent of vxch's extra scheduling smarts.
RANDOM_SEED=42            # RNG seed for DDIL packet-loss reproducibility (-1 = non-deterministic)
SPAWN_PRESET=distributed  # default | distributed (or any preset name in spawn_presets.yaml)

# RECORD_METRICS: on real hardware (--robot-id path), record a rosbag
# (/{robot}/explore/traversed_path, for path length; /{robot}/map, this
# robot's own raw local SLAM map; /{robot}/nav_map, the per-robot composite
# of local SLAM + fused team map -- NOTE: per_robot_map_compositor.py
# silently falls back to publishing local-only data on nav_map if it never
# receives a team map, so nav_map alone doesn't prove fusion happened, only
# /map and team_map_ddil together do; /{robot}/team_map_ddil, the raw
# fused-from-peers map ("the ddil map") before that local merge; plus, on
# vxch runs, this robot's own /{robot}/vxch/map/band_*+manifest and, per
# peer, the /{robot}/incoming/{peer}/band_*+manifest it actually received
# after DDIL throttling -- the real vxch traffic between robots) plus a
# periodic CPU load sample into experiment_runs/<timestamp>_<transport>_<robot>/, and
# redirect that run's ROS node logs there too (ddil_proxy_node's periodic
# "stats | rcvd=... sent=..." lines and occupancy_grid_vxch_node's "encode
# bands [...] total=... KB" lines give a free running summary alongside the
# bagged messages). Pull results with ./recover_metrics.sh. Off by default --
# only enable for a baseline/vxch comparison run.
RECORD_METRICS=true

NUM_ROBOTS=3

# ROBOT_HOSTS: real-hardware distributed map sharing. Every robot in the team,
# "name@ip@x@y@yaw" comma-separated (x/y/yaw = that robot's spawn offset in the
# shared map frame, matching what you pass via --robot-offset-x/y/yaw when you
# launch it). Each robot's own launch_real_hardware.sh excludes itself to get
# its peer list. Leave empty/commented to disable map sharing (single robot,
# or robots that don't need each other's maps).
ROBOT_HOSTS=robot1@192.168.100.108@0.0@0.0@0.0,robot2@192.168.100.135@6.0@1.3@0.0,robot3@192.168.100.114@0.0@-3.4@0.0