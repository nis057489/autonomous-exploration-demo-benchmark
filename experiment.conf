# VXCH experiment configuration.
# Source this file or set these env vars before running docker.sh / launch_real_hardware.sh.
# All values are optional; the defaults below produce an unmodified baseline run with no DDIL.

MAP_TRANSPORT=vxch    # baseline | vxch
BANDWIDTH_KBPS=0          # token-bucket rate limit on map transport link (0 = unlimited)
LOSS_PCT=0.0              # per-message drop probability 0–100
DELAY_MS=0                # additional forwarding delay in ms
HAAR_LEVELS=5             # Haar wavelet decomposition levels (vxch only; total bands = levels+1)
TILE_SIZE_M=2.0           # vxch only: encode the map as independent tile_size_m x tile_size_m
                          # Haar pyramids instead of one pyramid for the whole grid, so a
                          # still-changing area (wherever a robot currently is) can't starve
                          # another, already-settled area's detail bands from reaching a peer
MAX_TILES_PER_UPDATE=2    # vxch only: max distinct tiles serviced per send tick (-1 = uncapped)
MIN_RESEND_INTERVAL_S=2.0 # vxch only: floor on how often the same tile can be resent, so a
                          # tile re-dirtying on ordinary SLAM noise doesn't retransmit its whole
                          # band pyramid every tick (0 = no debounce). Keep this well under the
                          # 8s it was first tried at -- that made the DDIL map look stalled/slow
                          # to converge on real hardware; only raise it after confirming the
                          # link itself, not this cadence, is the actual bottleneck
RANDOM_SEED=42            # RNG seed for DDIL packet-loss reproducibility (-1 = non-deterministic)
ROBOT_STARTUP_DELAY_S=5.0 # per-robot exploration stagger: robot N waits N*delay seconds (0 = simultaneous)
# SPAWN_PRESET=distributed  # default | distributed (or any preset name in spawn_presets.yaml)

# RECORD_METRICS: on real hardware (--robot-id path), record a small rosbag
# (/{robot}/explore/traversed_path for path length, /{robot}/map for this
# robot's own ground-truth local coverage, /{robot}/team_map_ddil for what
# DDIL -- baseline or vxch -- actually got through, for map-coverage-over-time
# comparisons) plus a periodic CPU load sample into
# experiment_runs/<timestamp>_<transport>_<robot>/, and redirect that run's
# ROS node logs there too (ddil_proxy_node's periodic "stats | rcvd=...
# sent=..." lines already give bytes actually transmitted per link, and
# occupancy_grid_vxch_node's "encode bands [...] total=... KB" lines give
# encoded size before DDIL throttling on vxch runs -- both come for free from
# existing logging, no need to bag anything extra for those). Pull results
# with ./recover_metrics.sh. Off by default -- only enable for a
# baseline/vxch comparison run.
RECORD_METRICS=true

NUM_ROBOTS=2

# ROBOT_HOSTS: real-hardware distributed map sharing. Every robot in the team,
# "name@ip@x@y@yaw" comma-separated (x/y/yaw = that robot's spawn offset in the
# shared map frame, matching what you pass via --robot-offset-x/y/yaw when you
# launch it). Each robot's own launch_real_hardware.sh excludes itself to get
# its peer list. Leave empty/commented to disable map sharing (single robot,
# or robots that don't need each other's maps).
ROBOT_HOSTS=robot1@192.168.100.108@0.0@0.0@0.0,robot2@192.168.100.135@6.0@1.3@0.0,robot3@192.168.100.150@0.0@-3.4@0.0
