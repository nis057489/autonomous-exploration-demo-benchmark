# Hand-picked safety overrides, deep-merged on top of whichever nav2 params
# file is passed as --nav_params_file (currently nav2_bringup's stock
# nav2_params.yaml) -- see hw_namespaced_stack.launch.py::_patch_nav_params.
# Everything else in the nav2 stack is stock; this file exists only for the
# handful of values that directly control how close the robot gets to
# obstacles before avoiding them, carried over unchanged from this repo's
# original hand-tuned navigation_hw.yaml (see git history / the original
# frontier_exploration_ros2-era config for the full file this was pulled
# from).
#
# Why these specific values, not nav2's or TurtleBot3's own stock defaults:
#   - footprint: measured from the real Waffle Pi body (306mm x 281mm,
#     padded ~5cm/side), not a robot_radius circle. TurtleBot3's own
#     official turtlebot3_navigation2/param/waffle_pi.yaml uses
#     robot_radius: 0.15, which is smaller than the robot's actual
#     corner-to-corner extent (~0.26m diagonal) -- nav2 ends up thinking
#     the robot is skinnier than it is and lets planned paths brush closer
#     to obstacles than the real body clearance allows. This polygon
#     matches the true footprint instead.
#   - inflation_radius / cost_scaling_factor: local costmap uses a smaller
#     radius + steeper falloff (tight, fast-reacting local avoidance);
#     global costmap uses a larger radius + gentler falloff (biases the
#     planned path away from obstacles well in advance, not just at the
#     last moment).
#   - obstacle_layer scan ranges: matched to the LDS-02 LiDAR's real range
#     (nav2_bringup/TB3 stock defaults use much shorter ranges tuned for
#     smaller sim/demo spaces).
bt_navigator:
  ros__parameters:
    # Stock nav2_bringup default is 20ms (see nav2_bringup's nav2_params.yaml)
    # -- fine on a lightly loaded machine, but on these Pi 4s running SLAM +
    # full Nav2 + frontier_explorer + per_robot_map_compositor + team_map_fusion
    # + 2x ddil_proxy_node concurrently, planner_server/controller_server can
    # take longer than 20ms just to get scheduled and ack a goal request under
    # scheduling pressure -- bt_navigator was treating a merely-slow-to-ack
    # action server as dead and aborting every goal ("Timed out while waiting
    # for action server to acknowledge goal request"), even though the map and
    # frontiers were valid and the server was alive. 5s gives real headroom;
    # frontier goals are re-evaluated every replan_period_s anyway so a
    # genuinely-dead server is still caught quickly in practice.
    default_server_timeout: 5000

# turtlebot3_node (the real hardware driver) subscribes to cmd_vel as
# geometry_msgs/msg/TwistStamped, but nav2's cmd_vel chain
# (controller_server/behavior_server -> cmd_vel_nav -> velocity_smoother ->
# cmd_vel_smoothed -> collision_monitor -> cmd_vel) defaults
# enable_stamped_cmd_vel to false and publishes plain geometry_msgs/msg/Twist
# end to end. A topic name match with mismatched types never connects at the
# DDS layer -- confirmed live via `ros2 topic info -v /robot1/cmd_vel`
# showing collision_monitor publishing Twist while turtlebot3_node subscribes
# TwistStamped, and /robot1/joint_states position/velocity frozen at
# [0.0, 0.0] the entire run despite controller_server successfully computing
# and "passing" paths. Setting this true on every node in the chain makes the
# final /robot1/cmd_vel a TwistStamped, matching what the base actually needs.
controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    # Stock nav2_bringup default for MPPI's CostCritic is consider_footprint:
    # false, which scores each candidate trajectory's obstacle cost at the
    # robot's *center point* only, using the inflation layer's cost gradient
    # around a circular inscribed radius. That's fine for a circular
    # robot_radius footprint, but this file already overrides the footprint
    # below to the real, non-circular Waffle Pi rectangle (0.40m x 0.34m)
    # specifically because it extends past the inscribed circle at the
    # corners -- with consider_footprint false, MPPI can pick a trajectory
    # that keeps the robot's center clear of the inflation gradient while its
    # actual corners clip a wall or obstacle, especially turning around a
    # corner or through a doorway. true makes CostCritic collision-check the
    # actual swept footprint polygon against the costmap per candidate
    # trajectory instead of a single point.
    FollowPath:
      CostCritic:
        consider_footprint: true
        # Stock cost_weight (3.81) is lower than PathAlignCritic's 14.0 and
        # several other critics' 5.0 -- MPPI picks whichever trajectory
        # minimizes the weighted SUM across all critics, so even with
        # consider_footprint correctly computing a high cost near an
        # obstacle, staying tightly path-aligned could still win overall.
        # Measured directly from a real run's bag (each robot's own
        # traversed_path vs its own nav_map): minimum clearance from robot
        # center to the nearest mapped obstacle was 0.100-0.141m on all 3
        # robots, less than the footprint's own smallest half-dimension
        # (0.17m) -- i.e. the body was already overlapping the wall.
        # Weighting obstacle cost above every path-following critic makes
        # avoidance actually win that trade-off instead of losing it.
        cost_weight: 20.0

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: true

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: true

collision_monitor:
  ros__parameters:
    enable_stamped_cmd_vel: true

local_costmap:
  local_costmap:
    ros__parameters:
      footprint: "[[0.20, 0.17], [0.20, -0.17], [-0.20, -0.17], [-0.20, 0.17]]"
      footprint_padding: 0.01
      inflation_layer:
        inflation_radius: 0.30
        cost_scaling_factor: 8.0
      obstacle_layer:
        scan:
          raytrace_max_range: 7.5
          raytrace_min_range: 0.16
          obstacle_max_range: 6.0
          obstacle_min_range: 0.16

global_costmap:
  global_costmap:
    ros__parameters:
      footprint: "[[0.20, 0.17], [0.20, -0.17], [-0.20, -0.17], [-0.20, 0.17]]"
      footprint_padding: 0.01
      inflation_layer:
        inflation_radius: 0.55
        cost_scaling_factor: 3.0
      obstacle_layer:
        scan:
          raytrace_max_range: 7.5
          raytrace_min_range: 0.16
          obstacle_max_range: 6.0
          obstacle_min_range: 0.16
